packages:
  - "packages/*"
  - "examples/*"
  - "apps/*"

# Cap how many workspace packages pnpm runs a script in at once.
#
# Measured 2026-07-25: `pnpm -r test` failed 2 of 5 consecutive runs on an 8-core
# machine, each time in a DIFFERENT package (realtime, cartesia) that passed 20/20
# in isolation under heavy artificial load. The tests were not racing — the runner
# was oversubscribed. 26 packages have a test script and vitest sizes a worker pool
# per package to the core count, so an uncapped recursive run asks for ~200 workers
# on 8 cores. That produces two failure modes, both of which read as flaky tests:
# a 5s timeout from a pool that never gets scheduled, and ERR_IPC_CHANNEL_CLOSED
# from tinypool losing a worker outright (zero failing assertions).
#
# Capped: 8 of 8 full runs green. Uncapped: 3 of 5. Raise only with evidence.
workspaceConcurrency: 2

overrides:
  undici: ">=7.28.0"
  # The tree carries three @types/node majors (18/22/24), each pinning a different
  # undici-types (5.26.5 / 6.21.0 / 7.18.2). 6.21.0's global `Response` lacks the
  # newer `bytes()` method, so a fresh install can land two conflicting `Response`
  # definitions in one compilation (TS2741 in @kuralle-syrinx/ws workers.ts). Pin
  # one undici-types — 7.x, matching the undici runtime override — so there is a
  # single, consistent global fetch surface across every @types/node.
  undici-types: ">=7.18.2"
  hono: ">=4.12.25"
  form-data: ">=4.0.6"
  protobufjs: ">=7.6.3"
  js-yaml: "3.15.0"
  esbuild: ">=0.28.1"
  vite: "6.4.3"
  # Astro 6 (apps/docs) requires vite 7; the rest of the monorepo pins vite 6.4.3
  # (vitest/studio/browser-client). Scope astro's vite to 7 so only the docs build
  # gets it — everything else stays on 6.4.3.
  "astro>vite": "^7.3.2"
  ws: ">=8.21.0"

packageExtensions:
  "@huggingface/transformers":
    dependencies:
      onnxruntime-common: 1.24.3

allowBuilds:
  "@google/genai": true
  core-js-pure: false
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  workerd: true

# The committed lockfile is reviewed/vetted. pnpm's lockfile re-verification pass
# ignores minimumReleaseAgeExclude, so it would otherwise reject freshly-published
# first-party @kuralle-agents/* entries on every install/run. trustLockfile tells
# pnpm to trust the committed lockfile and not re-gate its existing entries; the
# cooldown still applies when RESOLVING newly-added packages. Requires pnpm >= 11.3.
trustLockfile: true

minimumReleaseAgeExclude:
  - '@mastra/core@1.41.0'
  - '@kuralle-agents/core@0.6.1'
  - '@kuralle-agents/rag@0.6.1'
  - '@kuralle-agents/skills@0.6.1'
  - '@kuralle-agents/core@0.7.0'
  - '@kuralle-agents/rag@0.7.0'
  - '@kuralle-agents/skills@0.7.0'
  - '@kuralle-agents/core@0.7.1'
  - '@kuralle-agents/rag@0.7.1'
  - '@kuralle-agents/skills@0.7.1'
  - '@kuralle-agents/vectorize-store@0.7.1'
  - '@kuralle-agents/core@0.8.5'
  - '@kuralle-agents/rag@0.8.5'
  - '@kuralle-agents/skills@0.8.5'
  - '@kuralle-agents/vectorize-store@0.8.5'
